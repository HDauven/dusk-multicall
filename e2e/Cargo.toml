[package]
name = "multicall-e2e"
description = "End-to-end checks of the multicall on a local Rusk 1.7.1 node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dusk-multicall = { workspace = true, features = ["data-driver"] }
dusk-core = "=1.7.0"
# dusk-core 1.7's ^0.7.0-rc.0 resolves to 0.7.0, whose crypto stack needs Rust
# 1.96.1; Rusk 1.7.1 locks the release candidate.
jubjub-schnorr = "=0.7.0-rc.0"
dusk-bytes = "0.1.7"
dusk-data-driver = "=0.3.1"
rkyv.workspace = true
bytecheck.workspace = true
ureq = { version = "2", default-features = false }
serde_json = "1"
hex = "0.4"
bs58 = "0.5"
sha2 = "0.10"
sha3 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand_chacha = "0.3"
