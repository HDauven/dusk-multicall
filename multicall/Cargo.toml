[package]
name = "dusk-multicall"
description = "Batch read-only contract calls into one Dusk query, answered at one state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
piecrust-uplink.workspace = true
rkyv.workspace = true
bytecheck.workspace = true
dusk-forge = { version = "=0.3.0", optional = true }
dusk-core = { version = "=1.7.0", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
serde_with = { version = "3", default-features = false, features = ["alloc", "hex"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }
dusk-data-driver = { version = "=0.3.1", optional = true }

[features]
# The deployable contract: `--target wasm32-unknown-unknown --features contract`.
contract = ["dep:dusk-forge", "dep:dusk-core", "dusk-core/abi-dlmalloc"]
serde = ["dep:serde", "dep:serde_with", "piecrust-uplink/serde"]
data-driver = ["dep:dusk-forge", "serde", "dep:serde_json", "dep:dusk-data-driver", "dusk-data-driver/wasm-export"]
# The JS data driver: `--target wasm32-unknown-unknown --features data-driver-js`.
data-driver-js = ["data-driver", "dusk-data-driver/alloc"]

[dev-dependencies]
serde_json = "1"
